<!doctype html>
<!-- data-fx is the effects switch fx.css branches on. Set here so the
     first paint is already animated; fx.js corrects it from the profile's
     setting on mount, and a reduced-motion media query overrides both. -->
<html lang="en" data-fx="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#060a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASCEND" />
    <meta name="description" content="A progression system built around whatever you are actually working on." />
    <link rel="icon" href="./ascend-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./ascend-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <title>ASCEND</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
